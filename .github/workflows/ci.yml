name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mindmate-frontend, mindmate-backend, mindmate-ai]

jobs:
  backend:
    name: Backend tests (memory layer, scoring, API, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          MINDMATE_LLM_MODE: "off"
          RATE_LIMIT_PER_MINUTE: "0"
      - name: Demo rehearsal (success criteria 1, 2, 3, 7)
        run: python scripts/demo_check.py
        env:
          MINDMATE_LLM_MODE: "off"

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mindmate
          POSTGRES_PASSWORD: mindmate
          POSTGRES_DB: mindmate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindmate"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          MINDMATE_TEST_DATABASE_URL: postgresql+psycopg://mindmate:mindmate@localhost:5432/mindmate_test
          MINDMATE_LLM_MODE: "off"
          RATE_LIMIT_PER_MINUTE: "0"

  ai:
    name: AI schema and parser tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Every root test_*.py runs here except the five that call Nemotron and need NEBIUS_API_KEY
      # (test_setup, test_model_selection, test_profile_agent, test_opportunity_agent, test_fit_agent).
      - run: python -m pytest . -q --ignore=tests --ignore=mindmate-frontend --ignore=test_setup.py --ignore=test_model_selection.py --ignore=test_profile_agent.py --ignore=test_opportunity_agent.py --ignore=test_fit_agent.py

      - name: Evaluation set (deterministic path)
        run: python scripts/run_eval.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindmate-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
