name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mindmate-frontend, mindmate-backend, mindmate-ai]

jobs:
  backend:
    name: Backend tests (memory layer, scoring, API, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          MINDMATE_LLM_MODE: "off"
          RATE_LIMIT_PER_MINUTE: "0"

  ai:
    name: AI schema and parser tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Every root test_*.py runs here except the five that call Nemotron and need NEBIUS_API_KEY
      # (test_setup, test_model_selection, test_profile_agent, test_opportunity_agent, test_fit_agent).
      - run: python -m pytest test_*.py -q --ignore=test_setup.py --ignore=test_model_selection.py --ignore=test_profile_agent.py --ignore=test_opportunity_agent.py --ignore=test_fit_agent.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindmate-frontend/package-lock.json
      - run: npm ci
      # Two pre-existing lint errors (ThemeContext.tsx, Scanner.tsx) are tracked by the frontend
      # developer; lint is advisory until they are fixed, the build is required.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
