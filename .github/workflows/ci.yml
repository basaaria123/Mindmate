name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mindmate-frontend, mindmate-backend, mindmate-ai]

jobs:
  backend:
    name: Backend tests (memory layer, scoring, API, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          MINDMATE_LLM_MODE: "off"
          RATE_LIMIT_PER_MINUTE: "0"

  ai:
    name: AI schema and parser tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Agent tests (test_*_agent.py, test_setup.py, test_model_selection.py) need NEBIUS_API_KEY
      # and network access; they are run locally by the AI developer, not in CI.
      - run: python -m pytest test_json_utils.py test_fit_schema.py test_opportunity_schema.py test_profile_schema.py -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mindmate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mindmate-frontend/package-lock.json
      - run: npm ci
      # Two pre-existing lint errors (ThemeContext.tsx, Scanner.tsx) are tracked by the frontend
      # developer; lint is advisory until they are fixed, the build is required.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
