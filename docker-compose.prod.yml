# Full MindMate stack on one VM (for example a Nebius AI Cloud VM).
#
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec backend python scripts/reset_demo.py --seed-only
#   python scripts/smoke_test.py --backend http://<vm>:8000 --frontend http://<vm>
#
# The frontend can instead be hosted on Vercel (docs/DEPLOYMENT.md); then run only
# the postgres and backend services.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mindmate}
    volumes:
      - mindmate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindmate}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mindmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mindmate}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      MINDMATE_AUTO_CREATE_SCHEMA: "false"
      MINDMATE_AUTO_SEED: "false"
      MINDMATE_LLM_MODE: ${MINDMATE_LLM_MODE:-live}
      MINDMATE_DEMO_CACHE: ${MINDMATE_DEMO_CACHE:-fallback}
      MINDMATE_ADMIN_TOKEN: ${MINDMATE_ADMIN_TOKEN:?set MINDMATE_ADMIN_TOKEN in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./mindmate-frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL in .env.production}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mindmate-postgres:
